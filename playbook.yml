- name: "Terraform learn"
  hosts: terraform_ansible

  tasks:
    
    - name: Install django deps
      apt:
        pkg:
          - python3
          - virtualenv

        update_cache: yes
      become: yes

    - name: Setup django
      pip:
        virtualenv: /home/ubuntu/venv
        name:
          - django
          - djangorestframework
      



